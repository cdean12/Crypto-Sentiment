name: Collect sentiment and rebuild dashboard

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python collect.py
      - name: Build dashboard
        run: python build.py
      - name: Commit changes
        run: |
          git config user.name "sentiment-bot"
          git config user.email "sentiment-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
